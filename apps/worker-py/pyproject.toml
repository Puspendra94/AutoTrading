[project]
name = "algo-trading-worker"
version = "0.1.0"
description = "Standalone Python Data + AI worker for the AutoTrading platform (24/7)."
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "python-dotenv>=1.0",
    "websockets>=12.0",   # live Binance kline stream (Phase 1 ingestion)
    "redis>=5.0",         # async pub/sub — publishes market:tick to the backend
    # AI section (strategy generation, Phase 3b) — LangChain, same providers as the backend.
    "pydantic>=2.0",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-aws>=0.2",
    "langchain-deepseek>=0.1",
    "binance-connector>=3.0",   # live market-order placement (Phase 3c-2 execution)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
# `python -m worker.backfill BTCUSDT 1m` etc. — see worker/backfill.py
worker = "worker.main:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
