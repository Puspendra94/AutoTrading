# Application stack: backend, frontend, worker.
#
# Brought up AFTER docker-compose.infra.yml — it joins the `algo_trading` network that stack
# creates, and will refuse to start if that network does not exist yet.
#
#   docker compose -f docker-compose.apps.yml up -d --build
#
# Compose owns the WIRING (hosts, ports, credentials, brain flags) from deploy/.env, so a fresh
# host is configured from one file. Each app's own .env is still read if present, for anything
# not listed here; values set under `environment:` always win.
#
# Note the internal ports: inside this network Postgres is 5432 and Redis is 6379 — NOT the 5433
# and 55000 the infra stack publishes on the host. Those published ports are loopback-only and
# exist for SSH tunnelling, not for these services.

name: algo-trading-apps

services:
  backend:
    build:
      context: ../apps/backend
    image: algo-trading-backend
    restart: unless-stopped
    env_file:
      - path: ../apps/backend/.env
        required: false
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:?set in deploy/.env}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
      DATABASE_NAME: ${POSTGRES_DB:-postgres}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-Algo_Trading}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in deploy/.env}
      PORT: 3009
      # The worker owns the stream and execution; the backend must not also run them or every
      # order would be placed twice.
      LIVE_STREAM_SOURCE: redis
      LIVE_EXECUTION_SOURCE: worker
      JWT_SECRET: ${JWT_SECRET:?set a long random JWT_SECRET in deploy/.env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set in deploy/.env}
      LLM_MODELS: ${LLM_MODELS:-deepseek:deepseek-v4-flash}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    # No published port. The frontend proxies to it over this network; exposing the API directly
    # would only widen the attack surface.
    networks: [algo_trading]

  frontend:
    build:
      context: ../apps/frontend
    image: algo-trading-frontend
    restart: unless-stopped
    environment:
      PORT: 4321
      BACKEND_INTERNAL_URL: http://backend:3009
    depends_on: [backend]
    ports:
      # Loopback by DEFAULT. This app has a login form and no TLS, so publishing it straight to
      # the internet would put your password on the wire in cleartext. Reach it with:
      #   ssh -L 4321:127.0.0.1:4321 user@host   then open http://localhost:4321
      # To expose it properly, put a TLS terminator (Caddy gets certificates automatically) in
      # front rather than setting FRONTEND_BIND=0.0.0.0.
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-4321}:4321"
    networks: [algo_trading]

  worker-py:
    build:
      context: ../apps/worker-py
    image: algo-trading-worker-py
    restart: unless-stopped
    env_file:
      - path: ../apps/worker-py/.env
        required: false
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:?set in deploy/.env}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
      DATABASE_NAME: ${POSTGRES_DB:-postgres}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-Algo_Trading}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in deploy/.env}
      BACKEND_URL: http://backend:3009
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set in deploy/.env}
      # --- What this process actually does. These are the switches that decide whether it
      # trades, so they are set explicitly here rather than inherited from a stale app .env.
      TRADING_BRAIN: ${TRADING_BRAIN:-pattern}
      PATTERN_DECISIONS_ENABLED: ${PATTERN_DECISIONS_ENABLED:-false}
      PATTERN_INTERVAL: ${PATTERN_INTERVAL:-15m}
      LIVE_STREAM_ENABLED: "true"
      WORKER_OWNS_EXECUTION: "true"
      # Strategy-brain machinery stays off under the pattern brain.
      GENERATION_SOURCE: "off"
      HYBRID_EXIT_AI: "false"
      SUPERVISOR_ENABLED: "false"
      LLM_MODELS: ${LLM_MODELS:-deepseek:deepseek-v4-flash}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY in deploy/.env}
      # First boot re-fetches the full candle history from data.binance.vision, so an empty
      # database is the expected starting point — no dump/restore needed.
      BACKFILL_ON_START: ${BACKFILL_ON_START:-true}
    # No ports: the worker has no HTTP surface. It talks to the DB, Redis, and Binance.
    networks: [algo_trading]

networks:
  # Created by docker-compose.infra.yml. `external` is why infra must be up first — and why a
  # missing network is a clear error here instead of two stacks silently not seeing each other.
  algo_trading:
    name: algo_trading
    external: true
