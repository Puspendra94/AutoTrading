# Project-level stack: the three apps only. Database and Redis are NOT defined here — the
# apps connect to an external Postgres/Timescale + Redis using credentials taken from env
# (each service's .env, with the host overridden to reach the host machine). Run the DB/Redis
# however you like (e.g. infra/docker-compose.yml, or a managed instance).
#
#   docker compose up            # builds & starts backend + frontend + worker-py
#
# Networking model:
#   * Inside the compose network the apps talk to each other by service name on their fixed
#     internal ports (frontend -> http://backend:3009). No published port is used for that.
#   * Published host ports are set to 0, so Docker picks a random free host port (see them with
#     `docker compose ps`). Only the frontend needs to be reached from a browser; it proxies
#     /api and /socket.io to the backend internally, so the backend's random port is optional.
#   * When you run an app individually (npm run dev, etc.) it uses its own port directly.

services:
  backend:
    build:
      context: ./apps/backend
    image: algo-trading-backend
    restart: unless-stopped
    env_file:
      - path: ./apps/backend/.env
        required: false
    environment:
      # DB/Redis are external. The app .env uses localhost (for `npm run dev`); inside a
      # container that must instead point at the host — so override just the *host* here.
      # Distinct var names (COMPOSE_*) so they don't collide with DATABASE_HOST=localhost
      # in .env; set them if your DB/Redis live somewhere other than the host machine.
      DATABASE_HOST: ${COMPOSE_DB_HOST:-host.docker.internal}
      REDIS_HOST: ${COMPOSE_REDIS_HOST:-host.docker.internal}
      PORT: 3009
      # Shared secret guarding /internal/jobs/* — must match worker-py's value below.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-internal-secret}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets host.docker.internal resolve on Linux too
    ports:
      - "0:3009"   # random published host port (optional external/debug access)

  frontend:
    build:
      context: ./apps/frontend
    image: algo-trading-frontend
    restart: unless-stopped
    environment:
      PORT: 4321
      # Internal, compose-network address of the backend — never the published port.
      BACKEND_INTERNAL_URL: http://backend:3009
    depends_on:
      - backend
    ports:
      - "0:4321"   # random published host port — this is the one you open in a browser

  worker-py:
    build:
      context: ./apps/worker-py
    image: algo-trading-worker-py
    restart: unless-stopped
    env_file:
      - path: ./apps/worker-py/.env
        required: false
    environment:
      DATABASE_HOST: ${COMPOSE_DB_HOST:-host.docker.internal}
      DATABASE_PORT: ${DATABASE_PORT:-5433}
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_NAME: ${DATABASE_NAME:-postgres}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-Algo_Trading}
      REDIS_HOST: ${COMPOSE_REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-55000}
      # Trigger the backend's internal job endpoints over the compose network.
      BACKEND_URL: http://backend:3009
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-internal-secret}
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No published port — the worker has no HTTP surface; it only talks to the DB + backend.
