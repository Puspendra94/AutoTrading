# Application stack: backend, frontend, worker. This is the only stack you redeploy.
#
#   docker compose -f infra/docker-compose.yml up -d    # ONCE — Postgres + Redis
#   docker compose up -d --build                        # every code change
#
# The infra stack is separate on purpose: rebuilding the apps never stops, recreates or otherwise
# touches the database container, so shipping a code change cannot cost you the data.
#
# CONFIGURATION MODEL — this is a dev-parity deployment, not a hardened production one.
# Every real setting (API keys, trading switches, risk limits) comes from each app's own .env via
# `env_file`, exactly as it does when you run the apps directly on your machine. The `environment:`
# block below overrides ONLY the DB/Redis wiring, because those are the sole values that must
# differ inside a container: the app .env files say localhost:5433 / localhost:55000, which is
# correct for `npm run start` on the host and wrong for a container. Note that `environment:`
# always wins over `env_file:` — anything pinned below cannot be changed from a .env.
#
# Nothing here requires a secret to be set before the stack will boot, and Redis runs without a
# password, matching the app code in this branch.

services:
  backend:
    build:
      context: ./apps/backend
    image: algo-trading-backend
    restart: unless-stopped
    env_file:
      - path: ./apps/backend/.env
        required: false
    environment:
      # Service names on the shared network — NOT the host's published 5433/55000.
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3009
      # Pinned rather than left to .env: the worker owns the kline stream and order placement. If a
      # stale .env let the backend run them too, every order would be placed twice. Same values the
      # app .env already carries — pinned so they cannot silently drift.
      LIVE_STREAM_SOURCE: redis
      LIVE_EXECUTION_SOURCE: worker
    networks: [algo_trading]
    # No published port: the frontend proxies /api and /socket.io to it over this network.

  frontend:
    build:
      context: ./apps/frontend
    image: algo-trading-frontend
    restart: unless-stopped
    environment:
      PORT: 4321
      # Internal compose address of the backend. The browser never sees this — server.mjs proxies
      # /api to it, and the built bundle calls the same-origin /api because PUBLIC_API_URL is left
      # unset at build time (apps/frontend/.dockerignore keeps .env out of the build context).
      BACKEND_INTERNAL_URL: http://backend:3009
    depends_on: [backend]
    ports:
      # Loopback by default. The app has a login form and serves it over plain HTTP, so publishing
      # it on a public interface would put the password on the wire in cleartext. Reach it with:
      #   ssh -L 4321:127.0.0.1:4321 user@host    then open http://localhost:4321
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-4321}:4321"
    networks: [algo_trading]

  worker-py:
    build:
      context: ./apps/worker-py
    image: algo-trading-worker-py
    restart: unless-stopped
    env_file:
      - path: ./apps/worker-py/.env
        required: false
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Reaches the backend's internal job endpoints over this network.
      BACKEND_URL: http://backend:3009
    depends_on: [backend]
    networks: [algo_trading]
    # No published port — the worker has no HTTP surface. It talks to Postgres, Redis and Binance.

networks:
  # Created by infra/docker-compose.yml. Declared external so bringing this stack up before the
  # infra stack fails with a clear error, rather than silently creating a second network on which
  # Postgres and Redis do not exist.
  algo_trading:
    name: algo_trading
    external: true
