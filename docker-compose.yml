# Application stack: backend, frontend, worker.
#
# Bring infra/docker-compose.yml up FIRST — this stack joins the `algo_trading` network that one
# creates. It is declared `external`, so starting these out of order fails with a clear error
# instead of leaving two stacks unable to see each other.
#
#   cd infra && docker compose up -d      # postgres + redis
#   cd ..    && docker compose up -d --build
#
# Compose owns the WIRING (hosts, ports, credentials, trading switches) from the root .env, so a
# fresh host is configured from one file per stack. Each app's own .env is still read when
# present, for anything not listed here; values under `environment:` always win — which is what
# stops a stale .env copied from a laptop from quietly changing what a deployed worker does.
#
# Note the ports: inside this network Postgres is 5432 and Redis 6379 — NOT the 5433/55000 that
# infra publishes on the host. Those are loopback-only, for tooling and SSH tunnels.

services:
  backend:
    build:
      context: ./apps/backend
    image: algo-trading-backend
    restart: unless-stopped
    env_file:
      - path: ./apps/backend/.env
        required: false
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?must match infra/.env}
      DATABASE_NAME: ${POSTGRES_DB:-postgres}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-Algo_Trading}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      PORT: 3009
      # The worker owns the stream and execution. The backend must not also run them, or every
      # order would be placed twice.
      LIVE_STREAM_SOURCE: redis
      LIVE_EXECUTION_SOURCE: worker
      # The only two the backend's own config validation requires (configuration.ts:144).
      JWT_SECRET: ${JWT_SECRET:?set a long random JWT_SECRET in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
      LLM_MODELS: ${LLM_MODELS:-deepseek:deepseek-v4-flash}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # Only read by 'bedrock:' entries in LLM_MODELS. Left unset the entries fail on
      # construction, which silently costs you the whole fallback tail of the chain.
      AWS_REGION: ${AWS_REGION:-}
      AWS_BEDROCK_API_KEY: ${AWS_BEDROCK_API_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    # No published port: the frontend proxies to it over this network. Exposing the API directly
    # would only widen the attack surface.
    networks: [algo_trading]

  frontend:
    build:
      context: ./apps/frontend
    image: algo-trading-frontend
    restart: unless-stopped
    environment:
      PORT: 4321
      BACKEND_INTERNAL_URL: http://backend:3009
    depends_on: [backend]
    ports:
      # Loopback by DEFAULT. This app has a login form and no TLS, so publishing it straight to
      # the internet would put the password on the wire in cleartext. Reach it with:
      #   ssh -L 4321:127.0.0.1:4321 user@host   then open http://localhost:4321
      # To expose it properly put a TLS terminator in front (Caddy obtains certificates
      # automatically) rather than setting BIND_ADDRESS=0.0.0.0.
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-4321}:4321"
    networks: [algo_trading]

  worker-py:
    build:
      context: ./apps/worker-py
    image: algo-trading-worker-py
    restart: unless-stopped
    env_file:
      - path: ./apps/worker-py/.env
        required: false
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?must match infra/.env}
      DATABASE_NAME: ${POSTGRES_DB:-postgres}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-Algo_Trading}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      BACKEND_URL: http://backend:3009
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
      # --- What this process actually does. Set explicitly, never inherited from an app .env,
      # because these are the switches that decide whether it trades.
      TRADING_BRAIN: ${TRADING_BRAIN:-pattern}
      PATTERN_DECISIONS_ENABLED: ${PATTERN_DECISIONS_ENABLED:-false}
      PATTERN_INTERVAL: ${PATTERN_INTERVAL:-15m}
      LIVE_STREAM_ENABLED: "true"
      WORKER_OWNS_EXECUTION: "true"
      # Strategy-brain machinery stays off under the pattern brain.
      GENERATION_SOURCE: "off"
      HYBRID_EXIT_AI: "false"
      SUPERVISOR_ENABLED: "false"
      LLM_MODELS: ${LLM_MODELS:-deepseek:deepseek-v4-flash}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY in .env}
      # Only read by 'bedrock:' entries in LLM_MODELS. Left unset the entries fail on
      # construction, which silently costs you the whole fallback tail of the chain.
      AWS_REGION: ${AWS_REGION:-}
      AWS_BEDROCK_API_KEY: ${AWS_BEDROCK_API_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      # First boot re-fetches the full candle history from data.binance.vision, so an empty
      # database is the expected starting point — no dump/restore needed.
      BACKFILL_ON_START: ${BACKFILL_ON_START:-true}
    # No ports: the worker has no HTTP surface. It talks to the DB, Redis and Binance.
    networks: [algo_trading]

networks:
  # Created by infra/docker-compose.yml.
  algo_trading:
    name: algo_trading
    external: true
